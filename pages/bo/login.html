<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>철공소닷컴 BO | 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/bo.css?v=20260512">
</head>
<body class="bo-login-page">
  <main class="bo-login-shell">
    <section class="bo-login-copy">
      <a class="bo-brand" href="index.html"><strong>철공소닷컴 BO</strong><small>운영 콘솔</small></a>
      <p class="bo-login-kicker">ADMIN SIGN IN</p>
      <h1>운영 업무를 시작합니다</h1>
      <p>예약, 결제, VOD, 콘텐츠, 커뮤니티, 고객문의를 한 콘솔에서 관리합니다.</p>
      <div class="bo-login-summary" aria-label="오늘의 운영 요약">
        <span><b>14</b>오늘 예약</span>
        <span><b>9</b>결제 확인</span>
        <span><b>7</b>고객문의</span>
      </div>
    </section>
    <section class="bo-panel bo-login-card" aria-label="BO 로그인">
      <div>
        <p class="bo-login-kicker">LOGIN</p>
        <h2>관리자 로그인</h2>
      </div>
      <form class="bo-login-form" action="index.html">
        <label class="bo-field"><span>운영자 ID</span><input type="text" value="admin@myeongrigyeol.kr"></label>
        <label class="bo-field"><span>비밀번호</span><input type="password" value="password"></label>
        <label class="bo-login-check"><input type="checkbox"><span>이 브라우저에서 ID 저장</span></label>
        <button class="bo-button is-primary" type="submit">로그인하고 대시보드로 이동</button>
      </form>
      <div class="bo-login-links">
        <a href="../support-inquiry.html">접속 문의</a>
        <a href="../../index.html">FO 메인으로 이동</a>
      </div>
    </section>
  </main>
</body>
</html>
